# Builds the site from site/ and publishes it to skills.vocaler.ai (Cloudflare Pages).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python3 site/build.py --site _site
      - name: Check skills are in sync with site/music_skills_data.py
        run: |
          python3 site/build.py --repo .
          git diff --exit-code -- skills .claude-plugin README.md
      - name: Publish
        if: ${{ env.HAS_TOKEN == 'true' }}
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy _site --project-name vocaler-skills --branch main
